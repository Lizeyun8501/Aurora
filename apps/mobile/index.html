<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6c8eef" />
    <title>Aurora Note</title>
    <style>
      /* V15 §2.1 设计令牌 — CSS 变量注入（WebView 全局） */
      :root {
        --brand: #4755B8;
        --brand-pressed: #3B479C;
        --brand-soft: rgba(71, 85, 184, 0.09);
        --bg-primary: #ffffff;
        --bg-secondary: #F9FAFB;
        --bg-card: #F9FAFB;
        --text-primary: #1F2937;
        --text-secondary: #6B7280;
        --text-tertiary: #9CA3AF;
        --border: #E5E7EB;
        --success: #36A36F;
        --warning: #E09F3E;
        --danger: #D64646;
        --radius-card: 8px;
        --radius-btn: 8px;
      }
      [data-theme='dark'] {
        --brand: #6372E0;
        --brand-pressed: #5563CC;
        --brand-soft: rgba(99, 114, 224, 0.14);
        --bg-primary: #111827;
        --bg-secondary: #1F2937;
        --bg-card: #1F2937;
        --text-primary: #e8eaed;
        --text-secondary: #9aa0a6;
        --text-tertiary: #9CA3AF;
        --border: #374151;
        --success: #42B980;
        --warning: #F0B85F;
        --danger: #E85C5C;
      }
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        overscroll-behavior-y: contain;
      }
      body {
        font-family: Inter, -apple-system, 'PingFang SC', 'Source Han Sans SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-size: 16px;
        -webkit-tap-highlight-color: transparent;
      }
      /* 安全区域 — V15 §4.4 底部导航避开手势条 */
      .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
