<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Aurora Editor Lab — DK-05 S0 桌面输入时序验证页</title>
  <style>
    /* 桌面视口：常规窗口布局 + 独立滚动容器（滚轮场景载体） */
    body { margin: 0; font-family: system-ui, sans-serif; }
    #editor {
      height: 70vh; overflow-y: auto;
      border: 1px solid #ddd; padding: 12px; outline: none;
    }
    #editor .ProseMirror { outline: none; min-height: 200px; }
    #status { padding: 8px; background: #f0f4ff; font-size: 12px; }
  </style>
</head>
<body>
  <div id="status">editor-lab ready</div>
  <div id="editor"></div>
  <script type="module">
    // DK-05 S0 桌面输入时序验证页 — 直接挂共享层编辑器实体
    // （@aurora/ui-components：editor-uplift 卡上移产物），验证：
    // ① 共享层在桌面构建栈可解析可运行（S1 接入前置）
    // ② loro-prosemirror 0.4.4 在桌面浏览器引擎下的输入时序
    //    （滚轮滚动中输入 / IME 组合 / 快速连续输入 — 桌面差异项）
    import { createAuroraEditor, auroraSchema } from '@aurora/ui-components';
    import { LoroDoc } from 'loro-crdt';

    const statusEl = document.getElementById('status');
    const loro = new LoroDoc();
    // 内存桥（S0 不涉持久化——桌面持久化链路 S2 落库时验）
    const handle = createAuroraEditor(document.getElementById('editor'), {
      loroDoc: loro,
      onSave: () => true,
    });
    const view = handle.view;
    window.__view = view;
    window.__loro = loro;
    window.__handle = handle;
    statusEl.textContent = 'editor-lab: view ready (shared ui-components + loro-prosemirror)';

    window.__probe = {
      pmText: () => view.state.doc.textBetween(0, view.state.doc.content.size, '\n'),
      docSize: () => view.state.doc.content.size,
      childCount: () => view.state.doc.childCount,
      selectionFrom: () => view.state.selection.from,
      scrollInfo: () => {
        const el = document.getElementById('editor');
        return { top: el.scrollTop, height: el.scrollHeight, client: el.clientHeight };
      },
      setCursor: (pos) => {
        const { TextSelection } = window.__pmState;
        view.dispatch(view.state.tr.setSelection(TextSelection.create(view.state.doc, pos)));
        return view.state.selection.from;
      },
      insertChars: (s) => {
        for (const ch of s) view.dispatch(view.state.tr.insertText(ch));
        return view.state.doc.textContent.length;
      },
      /** IME 组合输入序列（composition events 手动派发 + 提交落文） */
      runComposition: async (finalText) => {
        const dom = view.dom;
        dom.dispatchEvent(new CompositionEvent('compositionstart', { data: '' }));
        for (const part of ['q', 'quan', 'quanbu']) {
          dom.dispatchEvent(new CompositionEvent('compositionupdate', { data: part }));
        }
        dom.dispatchEvent(new CompositionEvent('compositionend', { data: finalText }));
        view.dispatch(view.state.tr.insertText(finalText));
        return view.state.doc.textContent.slice(-finalText.length);
      },
      /** 长文档填充（滚轮/滚动场景载体，逐段 dispatch — Loro 映射安全） */
      fillLongDoc: (n) => {
        for (let i = 0; i < n; i++) {
          const para = auroraSchema.nodes.paragraph.create(
            null,
            auroraSchema.text(`段落 ${i} — 桌面滚轮时序采样行`),
          );
          view.dispatch(view.state.tr.insert(view.state.doc.content.size, para));
        }
        return view.state.doc.childCount;
      },
      /** S1 只读锁定开关（view.setProps — 与生产 ReadOnlyAuroraEditor 同 API） */
      setEditable: (on) => {
        view.setProps({ editable: () => on });
        return view.editable;
      },
      /** S1 全节点 fixture — schema 合并对照表全类型各一实例（一个事务替换） */
      loadFullSchemaDoc: () => {
        const s = auroraSchema;
        const t = (txt, marks) => (marks ? s.text(txt, marks) : s.text(txt));
        const para = (txt, marks) =>
          s.nodes.paragraph.create(null, txt ? [t(txt, marks)] : null);
        const cell = (txt) =>
          s.nodes.table_cell.create(null, s.nodes.paragraph.create(null, txt ? [t(txt)] : null));
        const row = (cells) => s.nodes.table_row.create(null, cells);
        const li = (txt) => s.nodes.list_item.create(null, para(txt));
        const nodes = [
          s.nodes.heading.create({ level: 1 }, [t('一级标题')]),
          s.nodes.heading.create({ level: 2 }, [t('二级标题')]),
          s.nodes.heading.create({ level: 3 }, [t('三级标题')]),
          para('普通段落含内联标记', [s.marks.strong.create()]),
          para('斜体下划线', [s.marks.em.create(), s.marks.underline.create()]),
          s.nodes.code_block.create({ language: 'rust' }, [t('fn main() {}')]),
          s.nodes.blockquote.create(null, para('引用块内容')),
          s.nodes.bullet_list.create(null, [li('无序项一'), li('无序项二')]),
          s.nodes.ordered_list.create(null, [li('有序项一'), li('有序项二')]),
          s.nodes.task_block.create({ checked: true, task_id: 'T-1' }, [t('已完成任务')]),
          s.nodes.task_block.create({ checked: false, task_id: 'T-2' }, [t('进行中任务')]),
          s.nodes.table.create(null, [
            row([cell('列A'), cell('列B')]),
            row([cell('1'), cell('2')]),
          ]),
          s.nodes.horizontal_rule.create(),
          s.nodes.embed.create({ embed_type: 'image', url: 'https://example.com/a.png', title: '示例图' }),
          s.nodes.ai_suggestion.create({ suggestionType: 'continue', model: 'glm' }, [t('AI 建议文本')]),
        ];
        view.dispatch(view.state.tr.replaceWith(0, view.state.doc.content.size, nodes));
        return view.state.doc.childCount;
      },
    };
    // lab 不打包 prosemirror-state 顶层（经共享层间接依赖）——TextSelection 经
    // 全局透出给 setCursor：这里从 view.state 的构造器域取。
    import('prosemirror-state').then((m) => { window.__pmState = m; });
  </script>
</body>
</html>
