[package]
name = "aurora-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Aurora Note Desktop (Tauri v2)"

[dependencies]
# V20 P0-1: 默认 headless 编译模式（无 wry/WebView）— 服务器 CI 无 GTK/WebKit 也可
# 参与 workspace 编译验证；完整桌面构建在装齐系统库的开发机启用 "full" feature。
tauri = { version = "2", default-features = false, features = [] }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

aurora-core = { path = "../../../crates/aurora-core" }
aurora-security = { path = "../../../crates/aurora-security" }
# 共享启动装配（迁移 + DEK 保险库 + AppCore DI 注入 + startup）
aurora-bootstrap = { path = "../../../crates/aurora-bootstrap" }

dirs-next = "2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 默认 wry（真实 WebView）— CI 与开发机均已装齐 GTK/WebKit 系统库；
# 无系统库环境请用 cargo check --exclude aurora-desktop 验证 workspace 其余部分。
default = ["tauri/wry"]
full = ["tauri/tray-icon"]
