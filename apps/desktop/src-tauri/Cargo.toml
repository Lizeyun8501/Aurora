[package]
name = "aurora-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Aurora Note Desktop (Tauri v2)"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
tokio = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

aurora-core = { path = "../../../crates/aurora-core" }
aurora-security = { path = "../../../crates/aurora-security" }
# 共享启动装配（迁移 + DEK 保险库 + AppCore DI 注入 + startup）
aurora-bootstrap = { path = "../../../crates/aurora-bootstrap" }

dirs-next = "2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
