aurora-ai = { path = "../../../crates/aurora-ai" }
aurora-plugin = { path = "../../../crates/aurora-plugin" }
aurora-sync = { path = "../../../crates/aurora-sync" }
aurora-migration = { path = "../../../crates/migration" }

dirs-next = "2.0"

[features]
default = []
