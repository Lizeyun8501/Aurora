[workspace]
resolver = "2"
members = [
    "crates/aurora-core",
    "crates/aurora-sync",
    "crates/aurora-ai",
    "crates/aurora-security",
    "crates/aurora-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aurora-note/aurora-note"

[workspace.dependencies]
# CRDT engine
loro = "1"

# P2P sync
iroh = "0.34"

# Full-text search
tantivy = "0.22"

# Vector database
# Note: lancedb temporarily removed due to Rust toolchain compatibility.
# lancedb = "0.13"

# SQLite (including sqlite-vec for vector search)
rusqlite = { version = "0.32", features = ["bundled"] }
# Note: sqlite-vec is a loadable extension, not a direct crate dependency

# WASM runtime
wasmtime = "27"

# Cryptography
ring = "0.17"
argon2 = "0.5"
aes-gcm = "0.10"
sha3 = "0.10"
hkdf = "0.12"

# Random number generation
rand = "0.8"
rand_core = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "1"

# Logging
tracing = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Concurrency
parking_lot = "0.12"

# Embedded KV store
sled = "0.34"
