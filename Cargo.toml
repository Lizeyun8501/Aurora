[workspace]
resolver = "2"
members = [
    "crates/aurora-core",
    "crates/aurora-sync",
    "crates/aurora-ai",
    "crates/aurora-security",
    "crates/aurora-plugin",
    "crates/aurora-observability",
    "crates/aurora-bootstrap",
    "crates/entity",
    "crates/migration",
    "crates/mobile-ffi",
    # 桌面平台适配（Tauri v2）— Rust 1.91 工具链已就绪，V20 GAP-01 关闭
    "apps/desktop/src-tauri",
]

# 默认编译集 — headless 服务器/CI（无 GTK/WebKit 系统库）不编译桌面端；
# 桌面端验证在装齐系统库的开发机/CI job 执行: cargo check -p aurora-desktop
default-members = [
    "crates/aurora-core",
    "crates/aurora-sync",
    "crates/aurora-ai",
    "crates/aurora-security",
    "crates/aurora-plugin",
    "crates/aurora-observability",
    "crates/aurora-bootstrap",
    "crates/entity",
    "crates/migration",
    "crates/mobile-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aurora-note/aurora-note"

[workspace.dependencies]
# CRDT engine — loro 1.x 需 Rust 1.87+，workspace 中保留定义供 optional 引用
loro = "1"

# P2P sync — iroh 1.0 需 Rust 1.91+，workspace 中保留定义供 optional 引用
iroh = "1.0"

# Full-text search
tantivy = "0.22"

# Vector database
# Note: lancedb temporarily removed due to Rust toolchain compatibility.
# lancedb = "0.13"

# SQLite (including sqlite-vec for vector search)
rusqlite = { version = "0.32", features = ["bundled"] }
# Note: sqlite-vec is a loadable extension, not a direct crate dependency

# WASM runtime
wasmtime = "27"

# Cryptography
ring = "0.17"
argon2 = "0.5"
aes-gcm = "0.10"
sha2 = "0.10"
sha3 = "0.10"
hkdf = "0.12"
hmac = "0.12"
libcrux-ml-kem = "0.0.10"

# Random number generation
rand = "0.8"
rand_core = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Async trait macro (V19 §28 — Trait 异步化迁移)
async-trait = "0.1"

# Error handling
thiserror = "1"

# Logging
tracing = "0.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Concurrency
parking_lot = "0.12"

# Embedded KV store
sled = "0.34"

# Property-based testing & enum ergonomics (Task 6.3 test quality assurance)
proptest = "1"
strum = { version = "0.26", features = ["derive"] }

# ---------------------------------------------------------------------------
# [patch.crates-io] — local source replacements
# See `third_party/README.md` for rationale and minimum-change justification.
# Each entry is kept on a *minimum-divergence* line: only the bits that fail to
# compile upstream are relaxed; no crate's source is modified.
# Drop a patch (and its `third_party/<name>/` subdir) as soon as upstream
# publishes a compatible release.
# ---------------------------------------------------------------------------
[patch.crates-io]
# netwatch 0.19.1 hard-pins `windows = "0.62.2"` *and* `wmi = "0.18"` while
# `wmi 0.18.4` cannot compile against `windows-core 0.62.x` (Free/Interface
# ABI breaks). Our vendored copy only relaxes those two version pins so the
# resolver unifies on `windows 0.61.x` (compatible with wmi 0.18.4). Tracked
# in PR feat/ai-ollama-provider; remove when upstream ships a fix.
netwatch = { path = "third_party/netwatch" }
