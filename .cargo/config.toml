# Android NDK cross-compilation config
# Auto-generated for Aurora APK build
#
# 2026-10-26（APK CI 通道）：linker/ar 裸名化（原 /home/z/... 本机硬路径——
# CI runner 的 SDK 路径不同必挂）。裸名解析依赖 PATH 含 NDK toolchain bin：
# 本机走 build-android-libs.sh（已前置 PATH）；CI 走 apk-release.yml（同款
# PATH 前置）。裸敲 cargo build --target aarch64-linux-android 需自行 export
# PATH=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH。

[target.aarch64-linux-android]
linker = "aarch64-linux-android24-clang"
ar = "llvm-ar"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi24-clang"
ar = "llvm-ar"

[target.x86_64-linux-android]
linker = "x86_64-linux-android24-clang"
ar = "llvm-ar"

[target.i686-linux-android]
linker = "i686-linux-android24-clang"
ar = "llvm-ar"
