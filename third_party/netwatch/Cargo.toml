# [aurora-note] UPSTREAM PATCH:
# netwatch 0.19.1 pins `windows = "0.62.2"` AND `wmi = "0.18"`. wmi 0.18.4's
# source uses `ComObject::into_interface` which requires the `Free` trait from
# `windows-core 0.61.x`; under windows-core 0.62.x that bound is unsatisfiable
# and the build fails with 16 errors on Windows. Upstream has not yet
# published a fix (wmi latest = 0.18.4; netwatch latest = 0.19.1; iroh latest
# = 1.0.3, as of 2026-08-06). We loosen the pin so the resolver unifies onto
# `windows 0.61.x` / `windows-core 0.61.2` / `windows-result 0.3.x`, against
# which `wmi 0.18.4` compiles cleanly. The set of Win32 features used by
# `src/interfaces/windows.rs` is unchanged.
# Tracked at: https://github.com/Lizeyun8501/Aurora — see PR feat/ai-ollama-provider.
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = ">=0.59, <0.62"
features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Foundation",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
]

[target.'cfg(target_os = "windows")'.dependencies.windows-result]
# netwatch's `src/netmon/windows.rs` references `windows_result::Error`
# directly (must be a declared dep — Rust 2021/2024 requires extern re-decl).
# Pin to 0.3.x to unify with windows-core 0.61.2's own windows-result dep
# (avoiding the 0.3.4+0.4 split that confuses `n0-error::stack_error`'s
# `From<windows_result::Error>` derive). Upstream's `windows-result = "0.4"`
# was paired with `windows = "0.62.2"` (which pulls windows-result 0.4);
# looser `windows = ">=0.59,<0.62"` unifies on 0.61.3 whose tree expects 0.3.
version = "0.3"

[target.'cfg(target_os = "windows")'.dependencies.wmi]
version = "0.18"

