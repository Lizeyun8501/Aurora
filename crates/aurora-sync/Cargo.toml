[package]
name = "aurora-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 本 crate 依赖核心层，复用 SyncTarget trait 与统一错误类型
aurora-core = { path = "../aurora-core" }

# CRDT engine — loro 1.x 需 Rust 1.87+，可选依赖
loro = { workspace = true, optional = true }

# P2P sync — iroh 1.0 需 Rust 1.91+（工具链已就绪，2026-08-24 启用）
iroh = { workspace = true, optional = true }

# Async traits
async-trait = { workspace = true }

# SQLite (sync_queue 持久化)
rusqlite = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Async runtime
tokio = { workspace = true }
futures = "0.3"

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Date/time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Concurrency
parking_lot = { workspace = true }

# Cryptography (HMAC-SHA256 signature verification for webhooks)
ring = { workspace = true }

# WebDAV 真实 HTTP 传输（DK-08 第一切片）— 与 aurora-ai 同规格
# （0.11 + rustls-tls），复用锁文件既有 reqwest 0.11 节点，不引入新版本
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
# WebDAV stub server（DK-08 测试 — 与 aurora-ai 测试同款）
mockito = "1"
# 传输层调试 + iroh 内存测试网络（多节点仿真测试，§7.4；TestTransport
# 属 unstable-custom-transports 门控，仅测试构建启用）
tracing-subscriber = "0.3"
iroh = { workspace = true, features = ["test-utils", "unstable-custom-transports"] }

[features]
default = []
# 启用 Loro CRDT 引擎（需要 Rust 1.87+）
loro-crdt = ["dep:loro"]
# 启用 iroh 真实传输层（需要 Rust 1.91+）— V19 §31 DEV-005
# 依赖 loro: iroh_transport.rs 直接操作 LoroDoc（版本向量交换 + 增量导入）
iroh-transport = ["dep:iroh", "loro-crdt"]
