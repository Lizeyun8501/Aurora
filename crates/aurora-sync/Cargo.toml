[package]
name = "aurora-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zstd.workspace = true
# 本 crate 依赖核心层，复用 SyncTarget trait 与统一错误类型
aurora-core = { path = "../aurora-core" }

# CRDT engine — loro 1.x 需 Rust 1.87+，可选依赖
loro = { workspace = true, optional = true }

# P2P sync — iroh 1.0 需 Rust 1.91+（工具链已就绪，2026-08-24 启用）
iroh = { workspace = true, optional = true }

# DK-46 CI 修复：relay 自签证书信任注入（CaTlsConfig::custom_roots 参数类型）
# ——替代 test-utils 门控的 insecure_skip_verify（CI 裸构建不生效致 UnknownCA）
rustls-pki-types = { version = "1", optional = true }

# Async traits
async-trait = { workspace = true }

# SQLite (sync_queue 持久化)
rusqlite = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Async runtime
tokio = { workspace = true }
futures = "0.3"

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Date/time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Concurrency
parking_lot = { workspace = true }

# Cryptography (HMAC-SHA256 signature verification for webhooks)
ring = { workspace = true }

# WebDAV 真实 HTTP 传输（DK-08 第一切片）— 与 aurora-ai 同规格
# （0.12 + rustls-tls，DK-31: TLS 链补洞——rustls 0.23/h2 0.4 链）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
# WebDAV stub server（DK-08 测试 — 与 aurora-ai 测试同款）
mockito = "1"
# DK-41 DoD2：SqliteStorage 双实例持久化面测试的临时 db 文件
tempfile = "3"
# 传输层调试 + iroh 内存测试网络（多节点仿真测试，§7.4；TestTransport
# 属 unstable-custom-transports 门控，仅测试构建启用）
tracing-subscriber = "0.3"
iroh = { workspace = true, features = ["test-utils", "unstable-custom-transports"] }
# DK-46: 本地 relay server 测试基建（Server::spawn 零外部依赖会合 e2e——预探 17418e7 范式）
iroh-relay = { version = "1.0.3", default-features = false, features = ["server", "test-utils"] }
# DK-46: 测试内命名 CertificateDer（LocalRelay.certs 字段——自签证书传节点构造器）
rustls-pki-types = "1"

[features]
default = []
# DK-46 历史槽位（insecure_skip_verify 已被 custom_roots 显式信任根取代——保留防破坏引用）
test-utils = []
# 启用 Loro CRDT 引擎（需要 Rust 1.87+）
loro-crdt = ["dep:loro"]
# 启用 iroh 真实传输层（需要 Rust 1.91+）— V19 §31 DEV-005
# 依赖 loro: iroh_transport.rs 直接操作 LoroDoc（版本向量交换 + 增量导入）
iroh-transport = ["dep:iroh", "dep:rustls-pki-types", "loro-crdt", "aurora-core/loro-crdt"]
