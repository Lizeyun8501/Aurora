[package]
name = "aurora-mobile-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Aurora Note mobile FFI bindings via UniFFI"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
jni = { version = "0.21", default-features = false }

# CRDT 文档模型 — V19 §36.3 移动端使用原生 Loro 绑定
loro = { workspace = true }

# 共享启动装配（迁移 + DEK 保险库 + AppCore DI）
aurora-bootstrap = { path = "../aurora-bootstrap" }
aurora-core = { path = "../aurora-core", features = ["loro-crdt"] }
aurora-security = { path = "../aurora-security" }
aurora-ai = { path = "../aurora-ai" }

[build-dependencies]
uniffi = { version = "0.28", features = ["build"] }

[dev-dependencies]
tempfile = "3"
