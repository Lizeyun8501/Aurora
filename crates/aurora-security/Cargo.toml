[package]
name = "aurora-security"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Cryptography
ring = { workspace = true }
argon2 = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
sha3 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
libcrux-ml-kem = { workspace = true }

aurora-core = { path = "../aurora-core" }

# Random number generation
rand = { workspace = true }
rand_core = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Date/time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Concurrency
parking_lot = { workspace = true }

# V20 Phase 2: SQLCipher 落盘加密（optional, 见 features.sqlcipher）
rusqlite = { version = "0.32", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
# V20 Phase 2: SQLCipher 落盘加密（源码编译, 无需系统 libsqlcipher;
# 编译 +~2min, feature 门控按需启用。测试: cargo test -p aurora-security --features sqlcipher）
sqlcipher = ["dep:rusqlite", "rusqlite/bundled-sqlcipher"]
