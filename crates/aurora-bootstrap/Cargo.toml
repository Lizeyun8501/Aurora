[package]
name = "aurora-bootstrap"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Aurora Note app bootstrap: shared AppCore DI wiring for desktop/mobile platform adapters"

[dependencies]
aurora-core = { path = "../aurora-core" }
aurora-security = { path = "../aurora-security" }
aurora-ai = { path = "../aurora-ai" }
aurora-migration = { path = "../migration" }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# V20 Phase 1: 数据源回调（KVStore note: 扫描 → IndexEntry）
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
