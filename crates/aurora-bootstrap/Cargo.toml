[package]
name = "aurora-bootstrap"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Aurora Note app bootstrap: shared AppCore DI wiring for desktop/mobile platform adapters"

[dependencies]
# wifi_only KV 读写：executor block_on（tokio 上下文内/外均安全——KV async 体为同步包装）
futures = "0.3"
# DK-08 §7.3：SyncGate/OfflineQueue 生产装配（仅 Wi-Fi 同步门）
aurora-sync = { path = "../aurora-sync" }
aurora-core = { path = "../aurora-core", features = ["loro-crdt"] } # I2/DK-01W: WritePath 需 Loro 快照（与 mobile-ffi 对齐）
aurora-security = { path = "../aurora-security" }
aurora-ai = { path = "../aurora-ai" }
aurora-migration = { path = "../migration" }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# V20 Phase 1: 数据源回调（KVStore note: 扫描 → IndexEntry）
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
aurora-sync = { path = "../aurora-sync" }
tempfile = "3"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros"] }
