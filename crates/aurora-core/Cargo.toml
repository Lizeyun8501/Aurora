[package]
name = "aurora-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# CRDT engine — loro 1.x 需 Rust 1.87+，可选依赖
loro = { workspace = true, optional = true }

# P2P sync — iroh 移至 aurora-sync，aurora-core 不直接依赖
# iroh = { workspace = true }

# Full-text search
tantivy = { workspace = true }

# Vector database
# lancedb = { workspace = true }

# SQLite (including sqlite-vec for vector search)
rusqlite = { workspace = true }
# 中文分词（V20: jieba 接入 Tantivy 自定义 tokenizer）
jieba-rs = "0.7"

# V20 Phase 3: NL→SQL 沙箱（QueryEngine 安全边界）
sqlparser = { version = "0.45", features = ["serde", "visitor"] }
# Note: sqlite-vec is a loadable extension, not a direct crate dependency

# WASM runtime
wasmtime = { workspace = true }

# Cryptography
ring = { workspace = true }
argon2 = { workspace = true }
aes-gcm = { workspace = true }
sha3 = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Async runtime
tokio = { workspace = true }
# Async trait macro (V19 §28 — Trait 异步化迁移)
async-trait = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Date/time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Concurrency
parking_lot = { workspace = true }

# Embedded KV store
sled = { workspace = true }

[dev-dependencies]
mockall = "0.13"
# Property-based testing harness (Task 6.3 test quality assurance)
proptest = { workspace = true }
# Temporary directories for atomic_transaction tests (ARCH-002)
tempfile = "3"
# V20 §6.2 性能门禁基准（P1: criterion 接入）
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "perf_bench"
harness = false

[features]
default = []
# 启用 Loro CRDT 引擎（需要 Rust 1.87+）
loro-crdt = ["dep:loro"]
