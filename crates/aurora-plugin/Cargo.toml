[package]
name = "aurora-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Core traits (PluginRuntime, Error, PluginManifest)
aurora-core = { path = "../aurora-core" }

# Async trait macro (V19 §28 — Trait 异步化迁移)
async-trait = { workspace = true }

# WASM runtime
wasmtime = { workspace = true }
# DK-14e.1: wasi:cli/io 预实现挂载（真 wasip2 组件 stderr 依赖）
wasmtime-wasi = { workspace = true }

# Cryptography (Ed25519 code signing)
ring = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }

# Async runtime (background preload for hot update)
tokio = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Date/time
chrono = { workspace = true }

# UUID
uuid = { workspace = true }

# Concurrency
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
# Real CryptoProvider implementation for signature verification tests
aurora-security = { path = "../aurora-security" }
# DK-14d.d1: wasm 文本 fixture 编译（DK-33 惯例——纯库非工具链）
wat = { workspace = true }
