name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # 2026-09-25: d4bbe22 起 src-tauri 拉入 aurora-import(loro 系) → 全量链接产物
  # 再次塞满 14G runner 盘 → ld SIGBUS (exit 101, V26 I2 同款复发)。
  # 关 debuginfo(-60% 产物) + 关增量编译(-2G 中间态)；CI 无调试需求。
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # V26 I2: runner 14G 盘被预装 SDK(≈10G)+编译链接临时文件塞满 → ld SIGBUS。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude aurora-desktop --all-targets -- -D warnings

  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # V26 I2: runner 14G 盘被预装 SDK(Android/.NET/Go ≈10G) + rust-cache +
      # 全量链接临时文件塞满 → ld SIGBUS (exit 101)。标准清理释放 ~10G。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            patchelf
      - uses: Swatinem/rust-cache@v2
      # 2026-09-25: summary 通道在本 runner 不可写（exit 1 且 summary 空）——
      # 改走 artifacts（公开 API 匿名可下载）作诊断通道。PIPESTATUS 显式取码。
      - name: Build
        run: |
          cargo build --workspace --verbose 2>&1 | tee /tmp/build.log; rc=${PIPESTATUS[0]}
          echo "BUILD_RC=$rc"; df -h / || true
          exit $rc
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 3
          if-no-files-found: ignore
      - name: Test
        run: |
          cargo test --workspace --exclude aurora-desktop --verbose 2>&1 | tee /tmp/test.log; rc=${PIPESTATUS[0]}
          echo "TEST_RC=$rc"
          exit $rc
      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test.log
          retention-days: 3
          if-no-files-found: ignore
      # DK-08 S5 盲区补齐（bravo-DK08-同步.md 验收记录）：多节点多 NAT 仿真
      # 与 iroh-transport 生产传输代码被 feature 门控，默认集不覆盖。
      - name: Test (iroh-transport feature)
        run: cargo test -p aurora-sync --features iroh-transport --verbose

  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # V26 I2: runner 14G 盘被预装 SDK(≈10G)+编译链接临时文件塞满 → ld SIGBUS。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - name: Check (MSRV)
        run: cargo check --workspace --exclude aurora-desktop

  # V20 P0-1: 桌面端 workspace 编译验证（需 GTK/WebKit 系统库）
  desktop-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # V26 I2: runner 14G 盘被预装 SDK(≈10G)+编译链接临时文件塞满 → ld SIGBUS。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 2026-09-25: 同 Test job——artifacts 诊断通道。
      - name: Check desktop crate
        run: |
          cargo check -p aurora-desktop 2>&1 | tee /tmp/dcheck.log; rc=${PIPESTATUS[0]}
          echo "CHECK_RC=$rc"; df -h / || true
          exit $rc
      - name: Upload dcheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcheck-log
          path: /tmp/dcheck.log
          retention-days: 3
          if-no-files-found: ignore
