name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # 2026-09-25: d4bbe22 起 src-tauri 拉入 aurora-import(loro 系) → 全量链接产物
  # 再次塞满 14G runner 盘 → ld SIGBUS (exit 101, V26 I2 同款复发)。
  # 关 debuginfo(-60% 产物) + 关增量编译(-2G 中间态)；CI 无调试需求。
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # V26 I2: runner 14G 盘被预装 SDK(≈10G)+编译链接临时文件塞满 → ld SIGBUS。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude aurora-desktop --all-targets -- -D warnings

  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    env:
      # writerchurn 复核（2026-10-02）：workspace 膨胀（DK-02 S3+DK-03 S3 全链）
      # 后 V26 I2 清理余量不再够全量 debug 编译 → ld SIGBUS exit 101 复现；
      # incremental 产物实测占 3-4G，关闭以留足链接空间。
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      # V26 I2: runner 14G 盘被预装 SDK(Android/.NET/Go ≈10G) + rust-cache +
      # 全量链接临时文件塞满 → ld SIGBUS (exit 101)。标准清理释放 ~10G。
      # 2026-10-02 扩容：+CodeQL/boost/JVM/rdkafka（再释 ~15G，workspace
      # 48cdc98→3467230 期间测试编译产物增长越过余量线）。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm /usr/share/swift /opt/hostedtoolcache/Python || true
          sudo docker image prune -af || true
          sudo apt-get clean || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            patchelf
      - uses: Swatinem/rust-cache@v2
      # 2026-10-07: Test job 同款 desktop 先例加 4G swap——runner 16G 上
      # workspace 全量测试（436 core+219 sync+…）内存峰值历史敏感（run151
      # loro OOM 先例），354 常规 Test 首红（代码同面 353 绿）归因资源类。
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 4G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      # 2026-09-25 根因收敛：run151 dcheck-log 仅 9.76KB（~200 crate 处挂，exit 101）
      # → cargo check 无链接也挂 → 非链接期盘满，是 loro 系 C++ 并行编译 OOM
      # （本地 4G 串行全绿佐证）。三管齐下：Build 排除 desktop（职责分离，
      # clippy/test 同集合已绿）、desktop-check 加 4G swap、削并行度。
      - name: Build
        run: |
          cargo build --workspace --exclude aurora-desktop --verbose 2>&1 | tee /tmp/build.log; rc=${PIPESTATUS[0]}
          echo "BUILD_RC=$rc"; df -h / || true
          exit $rc
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 3
          if-no-files-found: ignore
      # 2026-10-07: 失败重跑一次——常规 Test 亦确认 flake 面（354 首红，
      # 代码同面 353 绿）；两轮都挂=真失败证据链更强，单轮挂=环境瞬时抖动。
      - name: Test
        run: |
          cargo test --workspace --exclude aurora-desktop --verbose 2>&1 | tee /tmp/test.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "TEST_RETRY: 首轮失败（疑 runner 环境 flake），重跑一次"
            cargo test --workspace --exclude aurora-desktop --verbose 2>&1 | tee /tmp/test-retry.log; rc=${PIPESTATUS[0]}
          fi
          echo "TEST_RC=$rc"
          exit $rc
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: |
            /tmp/test.log
            /tmp/test-retry.log
          retention-days: 3
          if-no-files-found: ignore
      # 2026-10-07: ::error:: annotation 通道复制到 Test job（desktop-check
      # 2026-09-25 同款）——日志/artifact 全部登录墙后的唯一免认证诊断通道，
      # 失败测试名单直接进 annotation（匿名 check-run API 可读）。
      - name: Report test failure tail
        if: failure()
        run: |
          echo "::error::test-failed-list>> $(rg -o '^\s*test .* \.\.\. FAILED' /tmp/test-retry.log /tmp/test.log 2>/dev/null | sort -u | head -30 | tr '\n' '§' || echo none-captured)"
          echo "::error::test-log-bytes>> $(wc -c < /tmp/test.log 2>/dev/null || echo missing)"
          echo "::error::df>> $(df -h / | tail -1 | tr -s ' ')"
          echo "::error::free>> $(free -h | sed -n 2p | tr -s ' ')"
          echo "::error::oom>> $(sudo dmesg 2>/dev/null | rg -i 'oom|killed process' | tail -4 | tr '\n' '§' || echo none)"
          echo "::error::raw-tail>> $(tail -c 1500 /tmp/test-retry.log /tmp/test.log 2>/dev/null | tr '\n' '§' | tr '\r' ' ')"
      # DK-08 S5 盲区补齐（bravo-DK08-同步.md 验收记录）：多节点多 NAT 仿真
      # 与 iroh-transport 生产传输代码被 feature 门控，默认集不覆盖。
      # 2026-10-07 加固：本地 224 测全绿+同代码面 fd1464d CI 绿+之后连红 3 笔
      # （8min 快速失败）→ 判定 runner 资源类抖动（dk08 十节点拓扑内存敏感）。
      # 兜底=失败重跑一次；自愈=失败日志上传（此前该 step 无日志可查）。
      - name: Test (iroh-transport feature)
        run: |
          cargo test -p aurora-sync --features iroh-transport --verbose 2>&1 | tee /tmp/iroh-test.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            echo "IROH_RETRY: 首轮失败（疑 runner 资源类抖动），重跑一次"
            cargo test -p aurora-sync --features iroh-transport --verbose 2>&1 | tee /tmp/iroh-test-retry.log; rc=${PIPESTATUS[0]}
          fi
          exit $rc
      - name: Upload iroh test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iroh-test-log
          path: |
            /tmp/iroh-test.log
            /tmp/iroh-test-retry.log
          retention-days: 3
          if-no-files-found: ignore
      # 2026-10-07: iroh 失败名单进 annotation（Test job 同款匿名诊断通道）
      - name: Report iroh failure tail
        if: failure()
        run: |
          echo "::error::iroh-failed-list>> $(rg -o '^\s*test .* \.\.\. FAILED' /tmp/iroh-test-retry.log /tmp/iroh-test.log 2>/dev/null | sort -u | head -20 | tr '\n' '§' || echo none-captured)"
          echo "::error::iroh-oom>> $(sudo dmesg 2>/dev/null | rg -i 'oom|killed process' | tail -4 | tr '\n' '§' || echo none)"
          echo "::error::iroh-raw-tail>> $(tail -c 1500 /tmp/iroh-test-retry.log /tmp/iroh-test.log 2>/dev/null | tr '\n' '§' | tr '\r' ' ')"

  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # V26 I2: runner 14G 盘被预装 SDK(≈10G)+编译链接临时文件塞满 → ld SIGBUS。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - name: Check (MSRV)
        run: cargo check --workspace --exclude aurora-desktop

  # V20 P0-1: 桌面端 workspace 编译验证（需 GTK/WebKit 系统库）
  desktop-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # V26 I2: runner 14G 盘被预装 SDK(≈10G)+编译链接临时文件塞满 → ld SIGBUS。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # DK-16 补丁（D1 小卡后续）：dist 不入仓模式 → 干净 clone 无 frontend 产物，
      # tauri-build 的 generate_context 校验 frontendDist(../dist) 存在性 → check 前置 build。
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build frontend (tauri frontendDist prereq)
        run: |
          npm ci --no-audit --no-fund 2>&1 | tail -3
          cd apps/desktop && npx vite build 2>&1 | tail -3
          test -f dist/index.html || { echo "dist/index.html missing after build"; exit 3; }
      # 2026-09-25: loro 系 C++ 编译内存峰值 → 加 4G swap 兜底 + 削并行度。
      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 4G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      # 2026-09-25: artifacts 为诊断通道（公开可下载）；PIPESTATUS 显式取码。
      - name: Check desktop crate
        run: |
          CARGO_BUILD_JOBS=2 cargo check -p aurora-desktop 2>&1 | tee /tmp/dcheck.log; rc=${PIPESTATUS[0]}
          echo "CHECK_RC=$rc"; df -h / || true
          exit $rc
      - name: Upload dcheck log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcheck-log
          path: /tmp/dcheck.log
          retention-days: 3
          if-no-files-found: ignore
      # 2026-09-25: ::error:: 命令 → annotation（check-run API 匿名可读），
      # 这是 runner 日志/artifact 全部要求登录后的唯一免认证诊断通道。
      - name: Report crash tail
        if: failure()
        run: |
          echo "::error::dcheck-log-bytes>> $(wc -c < /tmp/dcheck.log 2>/dev/null || echo missing)"
          echo "::error::df>> $(df -h / | tail -1 | tr -s ' ')"
          echo "::error::free>> $(free -h | sed -n 2p | tr -s ' ')"
          echo "::error::oom>> $(sudo dmesg 2>/dev/null | rg -i 'oom|killed process' | tail -4 | tr '\n' '§' || echo none)"
          echo "::error::raw-tail>> $(tail -c 1200 /tmp/dcheck.log 2>/dev/null | tr '\n' '§' | tr '\r' ' ')"
