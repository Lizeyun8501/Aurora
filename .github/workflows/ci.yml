name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # 2026-09-25: d4bbe22 起 src-tauri 拉入 aurora-import(loro 系) → 全量链接产物
  # 再次塞满 14G runner 盘 → ld SIGBUS (exit 101, V26 I2 同款复发)。
  # 关 debuginfo(-60% 产物) + 关增量编译(-2G 中间态)；CI 无调试需求。
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # V26 I2: runner 14G 盘被预装 SDK(≈10G)+编译链接临时文件塞满 → ld SIGBUS。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --exclude aurora-desktop --all-targets -- -D warnings

  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # V26 I2: runner 14G 盘被预装 SDK(Android/.NET/Go ≈10G) + rust-cache +
      # 全量链接临时文件塞满 → ld SIGBUS (exit 101)。标准清理释放 ~10G。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            patchelf
      - uses: Swatinem/rust-cache@v2
      # 2026-09-25: 失败时把错误尾写入 job summary（匿名可见）——runner 日志页
      # 已要求登录，summary 是唯一免认证诊断通道。pipefail 直写，不走 PIPESTATUS。
      - name: Build
        run: |
          set -o pipefail
          df -h / > "$GITHUB_STEP_SUMMARY" || true
          echo '### Build (workspace, exclude aurora-desktop via test)' >> "$GITHUB_STEP_SUMMARY"
          cargo build --workspace --verbose 2>&1 | tee /tmp/build.log || {
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -80 /tmp/build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            df -h / >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --exclude aurora-desktop --verbose 2>&1 | tee /tmp/test.log || {
            echo '### Test run tail' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -80 /tmp/test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
      # DK-08 S5 盲区补齐（bravo-DK08-同步.md 验收记录）：多节点多 NAT 仿真
      # 与 iroh-transport 生产传输代码被 feature 门控，默认集不覆盖。
      - name: Test (iroh-transport feature)
        run: cargo test -p aurora-sync --features iroh-transport --verbose

  msrv:
    name: MSRV (1.91)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # V26 I2: runner 14G 盘被预装 SDK(≈10G)+编译链接临时文件塞满 → ld SIGBUS。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - uses: dtolnay/rust-toolchain@1.91.0
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libxdo-dev \
            patchelf
      - uses: Swatinem/rust-cache@v2
      - name: Check (MSRV)
        run: cargo check --workspace --exclude aurora-desktop

  # V20 P0-1: 桌面端 workspace 编译验证（需 GTK/WebKit 系统库）
  desktop-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # V26 I2: runner 14G 盘被预装 SDK(≈10G)+编译链接临时文件塞满 → ld SIGBUS。
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup || true
          sudo docker image prune -af || true
          df -h /
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 2026-09-25: 同 Test job——pipefail 直写 summary（免认证诊断）。
      - name: Check desktop crate
        run: |
          set -o pipefail
          df -h / > "$GITHUB_STEP_SUMMARY" || true
          echo '### desktop-check' >> "$GITHUB_STEP_SUMMARY"
          cargo check -p aurora-desktop 2>&1 | tee /tmp/dcheck.log || {
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -80 /tmp/dcheck.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            df -h / >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
