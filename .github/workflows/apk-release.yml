name: APK

# APK CI 通道（2026-10-26 用户拍板「Apk CI 出包」）：
# 触发=workflow_dispatch（手动拍板出包）或 push tag「apk-*」（免 API token
# 的触发面——git push origin apk-vNN 即出包）。
# 产物=arm64-v8a debug APK（对齐本机 v23 出包语义：装得上+WebView 调试可用；
# release 签名需 keystore secret，待用户提供后挂 release buildType）。
# 链路=v23 本机技能全链的 CI 化：前端 vite build → assets 热替换（单文件
# index.html）→ FFI arm64 交叉编译（.cargo/config.toml linker 裸名化+本 job
# PATH 前置）→ gradle assembleDebug → artifact。
# 内存纪律：CARGO_BUILD_JOBS=2（desktop-check OOM 同款预防——wasmtime/loro
# 重依赖交叉编译）；concurrency 串行（rust-cache 并发写竞态教训 41bc990 同源）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'apk-*'

concurrency:
  group: apk
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0" # SO 无需调试符号（链接产物 -60%）
  CARGO_BUILD_JOBS: "2"

jobs:
  arm64-debug:
    name: arm64 debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain + android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "apk-arm64" # 独立 key 域——与 CI job 缓存隔离

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: NDK 探测（预装自适配——免安装步骤）
        # 2026-10-26：sdkmanager 直装两挂（PATH 无该工具——ubuntu-latest→26
        # image SDK 布局重排）——runner 预装 NDK（ANDROID_NDK_HOME 或
        # $ANDROID_HOME/ndk/*）自适配探测。clang wrapper 名
        # aarch64-linux-android24-clang 跨 NDK 版本一致（uniffi 绑定无 NDK
        # 版本敏感面）；v23 本机 26.3 基线 SO 兼容 minSdk24 语义不变。
        run: |
          set -x
          NDK_ROOT="${ANDROID_NDK_HOME:-}"
          if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
            NDK_ROOT=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | head -1 || true)
          fi
          echo "NDK_ROOT=$NDK_ROOT"
          if [ -z "$NDK_ROOT" ] || [ ! -x "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" ]; then
            echo "::error::ndk-missing AH=$ANDROID_HOME NDKH=${ANDROID_NDK_HOME:-unset} ls>>$(ls "$ANDROID_HOME"/ndk 2>&1 | tr '\n' '§')"
            exit 1
          fi
          echo "NDK_ROOT=$NDK_ROOT" >> "$GITHUB_ENV"

      - name: Node + deps
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci

      - name: 前端构建（tsc+vite 单文件产物）
        working-directory: apps/mobile
        run: |
          npx tsc
          npx vite build

      - name: assets 热替换（单文件 index.html）
        run: cp apps/mobile/dist/index.html apps/mobile/android/app/src/main/assets/index.html

      - name: FFI arm64 交叉编译（linker 裸名解析——PATH 前置）
        run: |
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64"
          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export RANLIB_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ranlib"
          cargo build -p aurora-mobile-ffi --release --target aarch64-linux-android
          mkdir -p apps/mobile/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libaurora_mobile_ffi.so \
             apps/mobile/android/app/src/main/jniLibs/arm64-v8a/
          ls -la apps/mobile/android/app/src/main/jniLibs/arm64-v8a/

      - name: Gradle assembleDebug（8.5 对齐本机基线）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - run: gradle assembleDebug --no-daemon
        working-directory: apps/mobile/android
        # ANDROID_HOME=runner 预设 env（/usr/local/lib/android/sdk）——
        # 无 local.properties（未入库）时 gradle 自动读 env。

      - name: 上传 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-arm64-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: 上传 SO（诊断面——APK 外独立取证）
        uses: actions/upload-artifact@v4
        with:
          name: aurora-mobile-ffi-arm64-so
          path: target/aarch64-linux-android/release/libaurora_mobile_ffi.so
          retention-days: 7
